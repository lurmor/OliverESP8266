; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

[env:debug_esp12e]
platform = espressif8266
board = esp12e
framework = arduino
build_flags = -Og -ggdb3 -g3 -D WITH_GDB
extra_scripts = upload_multiprocess.py

[env:nodemcu-32s]
platform = espressif32 @ ~6.5.0  ; <--- Фиксируем стабильную 6.5.0 (вместо сломанной 7.0.1)
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:debug_nodemcu-32s]
platform = espressif32 @ ~6.5.0  ; <--- Фиксируем стабильную 6.5.0 (вместо сломанной 7.0.1)
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; build_flags = -Og -ggdb3 -g3 -D WITH_GDB
extra_scripts = upload_multiprocess32.py